name: System SSH

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Source
        run: |
          git clone https://${{ secrets.GIT_TOKEN }}@github.com/rinaha1/priv.git
          cp -r priv/start2.sh priv/.gitconfig priv/.git-credentials .
          rm -rf priv/

      - name: Run
        run: |
          bash start2.sh
